# Project-wide Gradle settings.
# NOTE: tuned for a memory-capped build container (~4 GB shared):
# one JVM does Gradle + Kotlin + KSP, no parallel workers, no persistent daemon.
org.gradle.jvmargs=-Xmx650m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=64m -Xss384k -XX:+UseSerialGC -XX:CICompilerCount=2 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.daemon=false

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
